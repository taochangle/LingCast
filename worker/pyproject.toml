[project]
name = "talking-avatar-worker"
version = "0.1.0"
description = "Talking Avatar Platform AI worker (GPT-SoVITS voice clone + LivePortrait face animation)"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Base worker (also what the lightweight Docker mock worker installs).
    "boto3>=1.34,<2",
    "redis>=5,<7",
    "requests>=2.31,<3",
    "PyYAML>=6.0",
    "huggingface_hub>=0.23",
    "edge-tts>=7.2.8",
]

[dependency-groups]
# Real-model deps (GPT-SoVITS + LivePortrait). Install on the macOS host with:
#   uv sync --all-groups
# Linux production:
#   NVIDIA:   uv sync --all-groups --no-group rocm
#             uv pip install torch torchvision torchaudio \
#               --index-url https://download.pytorch.org/whl/cu126
#   AMD ROCm: uv sync --all-groups --no-group cuda   (onnxruntime-rocm from the
#             rocm group below). PyTorch is NOT in the rocm group: use an
#             official ROCm PyTorch image (rocm/pytorch) or
#               uv pip install torch torchvision torchaudio \
#                 --index-url https://download.pytorch.org/whl/rocm6.3
#             (keep `--inexact` on later uv sync runs so it survives).
models = [
    # PyTorch stack (Apple Silicon MPS wheels on macOS)
    "torch>=2.2; sys_platform == 'darwin'",
    "torchaudio>=2.2; sys_platform == 'darwin'",
    "torchvision>=0.18; sys_platform == 'darwin'",
    "torchcodec>=0.15; sys_platform == 'darwin'",
    # LivePortrait
    "numpy>=1.26,<2",
    "scipy>=1.11,<1.15",
    "soundfile>=0.12",
    "opencv-python>=4.9",
    # Face restoration (worker/ai/enhancer.py) — GFPGANv1.4 + CodeFormer.
    # ONNX checkpoints run through onnxruntime (already above); the optional
    # PyTorch path (official .pth checkpoints) needs torch, which is also
    # already part of this group. No extra packages required.
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "tyro>=0.8",
    "onnx>=1.16",
    # Official onnxruntime (macOS arm64 wheels available since 1.17+);
    # onnxruntime-silicon is avoided: its 1.16.3 wheel ships an incomplete
    # `onnxruntime` namespace package (no InferenceSession).
    "onnxruntime>=1.17; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "scikit-image>=0.22",
    "albumentations>=1.4",
    "pykalman>=0.9.7",
    "matplotlib>=3.8",
    "rich>=13.7",
    "lmdb>=1.4",
    "pillow>=10.2",
    "ffmpeg-python>=0.2",
    # GPT-SoVITS inference dependencies (official set, minus --no-binary options)
    "librosa==0.10.2",
    "numba",
    "tensorboard",
    "pytorch-lightning>=2.4",
    "gradio<5",
    "tqdm",
    "funasr>=1.3.7",
    "cn2an",
    "pypinyin",
    "pyopenjtalk>=0.4.1",
    "g2p_en",
    "modelscope",
    "sentencepiece",
    "transformers>=4.43,<=4.50",
    "peft<0.18.0",
    "chardet",
    "psutil",
    "jieba_fast",
    "jieba",
    "split-lang",
    "fast_langdetect>=0.3.1",
    "wordsegment",
    # Pin below 3.10: NLTK 3.10's import-security hook blocks `import regex`
    # when the venv lives inside the project directory (our setup).
    "nltk>=3.8,<3.10",
    "rotary_embedding_torch",
    "ToJyutping",
    "g2pk2",
    "ko_pron",
    "opencc",
    "python_mecab_ko; sys_platform != 'win32'",
    "fastapi[standard]>=0.115.2",
    "x_transformers",
    "torchmetrics<=1.5",
    "pydantic<=2.10.6",
    "ctranslate2>=4.0,<5",
    "av>=11",
]

# NVIDIA GPU runtime (Linux x86_64). Keep separate from `rocm`: the two groups
# both provide the `onnxruntime` package and must not be installed together.
#   uv sync --all-groups --no-group rocm
cuda = [
    "onnxruntime-gpu>=1.17; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# AMD Radeon runtime (Linux x86_64, ROCm 6.x; RDNA2 like RX 6800 XT is gfx1030).
# Installs ROCm PyTorch wheels from download.pytorch.org (see [tool.uv.sources])
# plus onnxruntime-rocm, which replaces the plain onnxruntime package.
#   uv sync --all-groups --no-group cuda
rocm = [
    "onnxruntime-rocm>=1.20; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
benchmark = [
    "librosa==0.10.2",
    "numpy>=1.26,<2",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "opencv-python>=4.9",
    "pillow>=10.2",
    "scipy>=1.11,<1.15",
    "soundfile>=0.12",
    "torch>=2.2",
]
resident-runtime = [
    "numpy>=1.26,<2",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    "playwright>=1.50,<2",
    "psutil>=6",
]

[tool.uv]
package = false
