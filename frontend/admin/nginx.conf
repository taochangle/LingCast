server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Avatar images / voice audio can be a few dozen MB.
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Docker's embedded DNS: with variable proxy_pass nginx re-resolves
    # upstreams every `valid` window, so rebuilding an API container (new IP)
    # no longer leaves nginx pointing at a stale address (502s).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Worker callbacks (task status / base-video webhooks) go to the
    # scheduler microservice.
    location ~ ^/api/tasks/[0-9]+/status$ {
        set $scheduler_upstream http://api-scheduler:8083;
        proxy_pass $scheduler_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location ~ ^/api/avatars/[0-9]+/default-video$ {
        set $scheduler_upstream http://api-scheduler:8083;
        proxy_pass $scheduler_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location ~ ^/api/worker/capability$ {
        set $scheduler_upstream http://api-scheduler:8083;
        proxy_pass $scheduler_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location ~ ^/api/scene-videos/[0-9]+/complete$ {
        set $scheduler_upstream http://api-scheduler:8083;
        proxy_pass $scheduler_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location ~ ^/api/scene-videos/[0-9]+/progress$ {
        set $scheduler_upstream http://api-scheduler:8083;
        proxy_pass $scheduler_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # API reverse proxy -> admin microservice (management console).
    location = /api/projects/read {
        set $project_upstream http://api-admin:8081;
        proxy_pass $project_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    # Telegram Mini App login lives on api-telegram; route it there explicitly
    # (the audience TMA calls the same gateway, e.g. via the ngrok tunnel).
    location = /api/auth/telegram {
        set $user_upstream http://api-telegram:8084;
        proxy_pass $user_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /api/telegram/webhook {
        set $user_upstream http://api-telegram:8084;
        proxy_pass $user_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # Audience message entry and persisted history also serve local live tests.
    location ~ ^/api/(live/[0-9]+/message|live/chat|chat/history)$ {
        set $live_upstream http://api-live:8082;
        proxy_pass $live_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /api/ {
        set $admin_upstream http://api-admin:8081;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API documentation gateway (docs): aggregates Swagger/OpenAPI docs of
    # every HTTP microservice under /doc/<prefix> (api-admin / api-live /
    # api-scheduler / service-rag / service-tts).
    location /doc/ {
        set $docs_upstream http://docs;
        rewrite ^/doc/(.*)$ /$1 break;
        proxy_pass $docs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Object storage gateway: /media/<bucket>/<key> -> rustfs/<bucket>/<key>.
    # This keeps the S3-compatible service unexposed to the host while still
    # letting the browser stream uploaded images and generated videos.
    location /media/ {
        set $rustfs_upstream http://rustfs:9000;
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass $rustfs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Live streaming gateway: /live/<stream>.flv -> srs:8080/live/<stream>.flv
    # (HTTP-FLV pull for the <video> element; RTMP ingest stays internal).
    location /live/ {
        set $srs_upstream http://srs:8080;
        proxy_pass $srs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
