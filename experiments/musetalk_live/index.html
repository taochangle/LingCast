<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>LingCast · MuseTalk 独立实时测试</title><style>body{background:#101725;color:#eef3ff;font:16px system-ui;margin:24px auto;max-width:1000px;padding:0 24px}input,select,button{font:inherit;padding:10px;border-radius:8px;margin:6px}input{width:65%}canvas{height:65vh;max-width:95%;background:#000;border-radius:12px}pre{white-space:pre-wrap;color:#c7dcff}section{display:flex;gap:24px;flex-wrap:wrap}p{color:#aebed6;line-height:1.6}</style><h1>LingCast · MuseTalk 独立实时测试</h1><p>独立队列、常驻预热、JPEG 帧实时传送＋Web Audio 同步。保留 IndexTTS 整句配音，不接线上推流。</p><div id="ready">正在检查模型…</div><form id="form"><select id="avatar"><option value="zhixia">知夏</option><option value="ruotang">若棠</option></select><input id="text" maxlength="100" value="欢迎来到直播间，今天也很高兴在这里陪伴大家。" aria-label="数字人要说的话"><button id="submit">提交口播</button></form><section><canvas id="video" width="576" height="1024"></canvas><pre id="metrics">等待提交。</pre></section>
<script>
const $=id=>document.getElementById(id);let context,frames=[],buffer,startAudio,first=false,jobId,submitted,source,stats={},finished=false;
async function post(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error);return d}
function show(){$('metrics').textContent=JSON.stringify(stats,null,2)}
function begin(){if(first||!buffer||!frames.length)return;first=true;startAudio=context.currentTime+.08;source=context.createBufferSource();source.buffer=buffer;source.connect(context.destination);source.start(startAudio);stats.browser_audio_start_ms=performance.now()-submitted+80;let samples=buffer.getChannelData(0),onset=samples.findIndex(x=>Math.abs(x)>.01);stats.browser_first_speech_ms=stats.browser_audio_start_ms+Math.max(0,onset)/buffer.sampleRate*1000;requestAnimationFrame(paint);source.onended=async()=>{finished=true;$('submit').disabled=false;await post('/report',{id:jobId,metrics:stats});show()}}
function paint(){if(finished)return;let t=Math.max(0,context.currentTime-startAudio),chosen;while(frames.length&&frames[0].index/25<=t){if(chosen)chosen.image.close();chosen=frames.shift();}if(chosen){$('video').getContext('2d').drawImage(chosen.image,0,0);chosen.image.close();if(!stats.browser_first_frame_ms){requestAnimationFrame(()=>{stats.browser_first_frame_ms=performance.now()-submitted;show()})}stats.frames=(stats.frames||0)+1}requestAnimationFrame(paint)}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;stats={};frames=[];buffer=null;first=false;finished=false;context ||=new AudioContext();await context.resume();submitted=performance.now();try{let r=await post('/submit',{text:$('text').value,avatar:$('avatar').value});jobId=r.id;stats.job_id=r.id;show();let events=new EventSource('/events/'+jobId);let decoding=Promise.resolve();events.addEventListener('audio',async e=>{let d=JSON.parse(e.data);stats.server_tts_ready_ms=d.elapsed_ms;buffer=await context.decodeAudioData(await(await fetch(d.url)).arrayBuffer());stats.browser_audio_ready_ms=performance.now()-submitted;show();begin()});events.addEventListener('frame',e=>{let d=JSON.parse(e.data);decoding=decoding.then(async()=>{let image=await createImageBitmap(await(await fetch('data:image/jpeg;base64,'+d.jpeg)).blob());frames.push({index:d.index,image});begin()})});events.addEventListener('done',e=>{Object.assign(stats,JSON.parse(e.data).metrics);stats.browser_generation_done_ms=performance.now()-submitted;events.close();show()});events.addEventListener('error',e=>{if(e.data){stats.error=e.data;events.close();$('submit').disabled=false;show()}})}catch(e){stats.error=e.message;$('submit').disabled=false;show()}};
setInterval(async()=>{try{let r=await(await fetch('/readyz')).json();$('ready').textContent=r.ready?'模型已常驻并预热 · GPU 2':'模型加载和预热中…'}catch{}},2000);
</script></html>
