<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>LingCast · MuseTalk 独立实时测试</title><style>body{background:#101725;color:#eef3ff;font:16px system-ui;margin:24px auto;max-width:1000px;padding:0 24px}input,select,button{font:inherit;padding:10px;border-radius:8px;margin:6px}input{width:65%}canvas{height:65vh;max-width:95%;background:#000;border-radius:12px}pre{white-space:pre-wrap;color:#c7dcff}section{display:flex;gap:24px;flex-wrap:wrap}p{color:#aebed6;line-height:1.6}</style><h1>LingCast · MuseTalk 独立实时测试</h1><p>独立队列、常驻预热、JPEG 帧实时传送＋Web Audio 同步。保留 IndexTTS 整句配音，不接线上推流。</p><div id="ready">正在检查模型…</div><form id="form"><select id="mode" aria-label="输入模式"><option value="llm">互动提问 · Qwen 流式</option><option value="direct">直接口播 · 不经过 LLM</option></select><select id="avatar"><option value="zhixia">知夏</option><option value="ruotang">若棠</option></select><input id="text" maxlength="100" value="欢迎来到直播间，今天也很高兴在这里陪伴大家。" aria-label="数字人要说的话"><button id="submit">提交口播</button></form><pre id="reply" aria-label="Qwen 回复"></pre><section><canvas id="video" width="576" height="1024"></canvas><pre id="metrics">等待提交。</pre></section>
<script>
const $=id=>document.getElementById(id);let context,segments={},next=0,playing=false,allDone=false,total=0,jobId,submitted,stats={},raf,current;
async function post(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error);return d}
function show(){$('metrics').textContent=JSON.stringify(stats,null,2)}
function segment(index){return segments[index] ||= {frames:[],decode:Promise.resolve()}}
async function complete(){if(allDone&&!playing&&next>=total){$('submit').disabled=false;await post('/report',{id:jobId,metrics:stats});show()}}
function begin(){let part=segments[next];if(playing||!part?.buffer||!part.frames.length){complete();return}playing=true;current=part;part.start=context.currentTime+.08;let source=context.createBufferSource();source.buffer=part.buffer;source.connect(context.destination);source.start(part.start);let startMs=performance.now()-submitted+80;if(stats.browser_audio_start_ms===undefined){stats.browser_audio_start_ms=startMs;let onset=part.buffer.getChannelData(0).findIndex(x=>Math.abs(x)>.01);stats.browser_first_speech_ms=startMs+Math.max(0,onset)/part.buffer.sampleRate*1000}source.onended=()=>{cancelAnimationFrame(raf);playing=false;part.frames.forEach(f=>f.image.close());delete segments[next];next++;begin()};raf=requestAnimationFrame(paint);show()}
function paint(){if(!playing)return;let chosen,t=Math.max(0,context.currentTime-current.start);while(current.frames.length&&current.frames[0].index/25<=t){if(chosen)chosen.image.close();chosen=current.frames.shift()}if(chosen){$('video').getContext('2d').drawImage(chosen.image,0,0);chosen.image.close();if(stats.browser_first_frame_ms===undefined){stats.browser_first_frame_ms=performance.now()-submitted;requestAnimationFrame(()=>{show()})}stats.frames=(stats.frames||0)+1}raf=requestAnimationFrame(paint)}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;stats={};segments={};next=0;playing=false;allDone=false;total=0;$('reply').textContent='';context ||=new AudioContext();await context.resume();submitted=performance.now();try{let r=await post('/submit',{text:$('text').value,avatar:$('avatar').value,mode:$('mode').value});jobId=r.id;stats.job_id=r.id;show();let events=new EventSource('/events/'+jobId);events.addEventListener('token',e=>{let d=JSON.parse(e.data);$('reply').textContent+=d.text});events.addEventListener('audio',async e=>{let d=JSON.parse(e.data),part=segment(d.segment);part.buffer=await context.decodeAudioData(await(await fetch(d.url)).arrayBuffer());if(stats.browser_audio_ready_ms===undefined)stats.browser_audio_ready_ms=performance.now()-submitted;show();begin()});events.addEventListener('frame',e=>{let d=JSON.parse(e.data),part=segment(d.segment);part.decode=part.decode.then(async()=>{let image=await createImageBitmap(await(await fetch('data:image/jpeg;base64,'+d.jpeg)).blob());part.frames.push({index:d.index,image});begin()})});events.addEventListener('done',e=>{let d=JSON.parse(e.data);Object.assign(stats,d.metrics);stats.browser_generation_done_ms=performance.now()-submitted;allDone=true;total=d.segments;events.close();show();complete()});events.addEventListener('error',e=>{stats.error=e.data||'事件流断开';events.close();allDone=true;total=Object.keys(segments).length+next;if(!playing)$('submit').disabled=false;show()})}catch(e){stats.error=e.message;$('submit').disabled=false;show()}};
setInterval(async()=>{try{let r=await(await fetch('/readyz')).json();$('ready').textContent=r.ready?'模型已常驻并预热 · GPU 2':'模型加载和预热中…'}catch{}},2000);
</script></html>
