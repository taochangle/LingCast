<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>若棠 · 换装本地预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#e8edf8;font:15px/1.7 system-ui,sans-serif}main{max-width:1080px;margin:32px auto;padding:0 24px}h1{font-size:27px;margin:0}small,.muted{color:#a1aec5}.layout{display:grid;grid-template-columns:minmax(260px,390px) 1fr;gap:32px;margin-top:24px}video{display:block;width:100%;aspect-ratio:9/16;background:#050912;border-radius:18px;max-height:77vh;object-fit:contain}.panel{background:#131c2f;border:1px solid #26334d;padding:24px;border-radius:18px}button{border:1px solid #415278;border-radius:9px;padding:11px 16px;color:#e8edf8;background:#202e49;cursor:pointer;font:inherit;margin:0 8px 10px 0}button.active{background:#4364ad;border-color:#708fd5}ol{padding-left:24px}li{padding:8px;border-radius:6px}li.on{background:#24365b;color:#d9e7ff}.tag{font-size:12px;color:#a6c5ff;border:1px solid #405882;border-radius:99px;padding:3px 10px}.status{margin:18px 0;padding:12px;background:#0e1728;border-radius:9px}a{color:#a6c5ff}@media(max-width:720px){.layout{grid-template-columns:1fr}video{max-height:70vh}main{margin:20px auto}}
</style><main><span class="tag">仅本地 · 未上线</span><h1>沈若棠 · 换装预览</h1><small>真实口播与口型，按实际播放线程录制。离场、入场全程闭嘴静音。</small><div class="layout"><video id="video" controls playsinline preload="metadata" poster="assets/white/portrait.png"></video><section class="panel"><h2 style="margin-top:0">选择换装方向</h2><button id="forward">白衣 → 浅蓝</button><button id="backward">浅蓝 → 白衣</button><div><button id="slow">半速检查</button><button id="normal">正常速度</button></div><div class="status" id="status">正在读取本地成品…</div><ol id="steps"><li>原造型待机</li><li>完整说完告别语</li><li>闭嘴离场</li><li>空镜</li><li>新造型闭嘴入场并站定</li><li>切换新 idle 与口型形象</li><li>新造型回场口播</li><li>新造型继续待机</li></ol><p class="muted">测试素材仍有局限：起身、坐下时针织纹理和袖长会变化，腰部以下由模型补全。当前仅评审时序与换装观感，不代表可直接上线。</p><p><a href="recordings.json" target="_blank">播放时序与静音校验记录</a></p></section></div></main>
<script>const v=document.getElementById('video'),status=document.getElementById('status');let recordings=[],current=null;const steps=[...document.querySelectorAll('li')];function select(i,play){current=recordings[i];v.src=current.file;v.poster='assets/'+current.source+'/portrait.png';document.getElementById('forward').classList.toggle('active',i===0);document.getElementById('backward').classList.toggle('active',i===1);status.textContent='时序校验通过：走位零音频，新 idle 先于回场口播。';if(play)v.play().catch(()=>{});}function phase(){if(!current)return;let e=current.events,t=v.currentTime;let intro=e.find(x=>x.field==='wardrobe_phase'&&x.value==='intro').time,motion=e.find(x=>x.field==='wardrobe_phase'&&x.value==='motion').time,commit=e.find(x=>x.field==='wardrobe').time,outro=e.find(x=>x.field==='wardrobe_phase'&&x.value==='outro').time;let n=t<intro?0:t<motion?1:t<current.exit_end?2:t<current.empty_end?3:t<commit?4:t<outro?5:t<current.outro_end?6:7;steps.forEach((li,i)=>li.classList.toggle('on',i===n));}document.getElementById('forward').onclick=()=>select(0,true);document.getElementById('backward').onclick=()=>select(1,true);document.getElementById('slow').onclick=()=>v.playbackRate=.5;document.getElementById('normal').onclick=()=>v.playbackRate=1;v.ontimeupdate=phase;fetch('recordings.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{recordings=d;select(0,false)}).catch(()=>status.textContent='完整口播成品仍在生成，请稍后刷新。');</script></html>
