const names={white:'白衣',burgundy:'酒红裙',champagne:'香槟套装'},v=document.getElementById('video'),status=document.getElementById('status');let all=[],current,steps=[];const basics=['原造型待机','告别语完整说完','闭嘴离场','空镜','新造型闭嘴入场并站定','切换新 idle 与口型形象','新造型回场口播','新造型继续待机'];function choose(i,play){current=all[i];v.src=current.file;v.poster='assets/'+current.source+'/portrait.png';document.querySelectorAll('#choices button').forEach((b,n)=>b.classList.toggle('active',i===n));let list=[...basics];if(current.host_hint)list.splice(1,0,'主持提醒换装（随后模拟观众点播）');document.getElementById('steps').replaceChildren(...list.map(s=>{const n=document.createElement('li');n.textContent=s;return n}));steps=[...document.querySelectorAll('li')];status.textContent='校验通过：走位零音频，新 idle 先于回场口播。';document.getElementById('hint-note').textContent=current.host_hint?'联合演示模拟观众发送“换衣服”，提醒本身不会自动换装。四分钟限频与就绪、暂停、手动优先使用模拟时钟测试，不在视频里空等四分钟。':'可选择已就绪的换装方向，或主持提醒联合演示。';if(play)v.play().catch(()=>{});}function phase(){if(!current)return;const e=current.events,t=v.currentTime,intro=e.find(x=>x.field==='wardrobe_phase'&&x.value==='intro').time,commit=e.find(x=>x.field==='wardrobe').time,outro=e.find(x=>x.field==='wardrobe_phase'&&x.value==='outro').time,motion=e.find(x=>x.field==='wardrobe_phase'&&x.value==='motion').time,hint=e.find(x=>x.field==='wardrobe_phase'&&x.value==='host_hint');let n=t<intro?0:t<motion?1:t<current.exit_end?2:t<current.empty_end?3:t<commit?4:t<outro?5:t<current.outro_end?6:7;if(current.host_hint){if(t<intro)n=hint&&t>=hint.time?1:0;else n++;}steps.forEach((s,i)=>s.classList.toggle('on',i===n));}v.ontimeupdate=phase;document.getElementById('slow').onclick=()=>v.playbackRate=.5;document.getElementById('normal').onclick=()=>v.playbackRate=1;fetch('recordings.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{all=d;for(let i=0;i<d.length;i++){let b=document.createElement('button');b.textContent=d[i].host_hint?'主持提醒 → 观众点播':names[d[i].source]+' → '+names[d[i].target];b.onclick=()=>choose(i,true);docum
