[project]
name = "lingcast-cosyvoice-experiment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.3.1", "torchaudio==2.3.1", "numpy==1.26.4",
  "conformer==0.3.2", "diffusers==0.29.0", "hyperpyyaml==1.2.3",
  "inflect==7.3.1", "librosa==0.10.2", "lightning==2.2.4",
  "modelscope==1.20.0", "omegaconf==2.3.0", "onnxruntime==1.18.0",
  "openai-whisper==20231117", "transformers==4.51.3",
  "x-transformers==2.11.24", "soundfile==0.12.1", "rich==13.7.1",
  "pyarrow==18.1.0", "hydra-core==1.3.2", "huggingface-hub<1", "setuptools==80.9.0",
  "gdown==5.1.0", "matplotlib==3.7.5", "wget==3.2", "pyworld==0.3.4",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools==80.9.0"]
pyworld = ["numpy==1.26.4", "Cython==0.29.37", "setuptools==80.9.0"]
